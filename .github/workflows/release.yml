name: Release
# main のテストが通ったら、Developer ID で署名・公証した pkg を GitHub Release に置く
on:
  workflow_run:
    workflows: ["Swift Build and Test"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release pkg
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: macos-15
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      MARKETING_VERSION: 1.0.${{ github.run_number }}
    steps:
      - name: Select Xcode 16.3
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_16.3*.app | head -n 1)
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          submodules: true
          lfs: true
      - name: Fetch LFS files in submodules
        run: git submodule foreach --recursive git lfs pull
      - name: Apply bundle ID and Team ID
        # リポジトリには本家の ID が入っているので、フォークの ID に置き換える
        env:
          BUNDLE_OWNER: ${{ vars.BUNDLE_OWNER }}
          TEAM_ID: ${{ vars.TEAM_ID }}
        run: |
          test -n "$BUNDLE_OWNER" && test -n "$TEAM_ID"
          git grep -lz -e 'ensan\.inputmethod' -e '9S3UXHYP65' -- ':!.github' | xargs -0 sed -i '' \
            -e "s/\([a-z]*\)\.ensan\.inputmethod/\1.${BUNDLE_OWNER}.inputmethod/g" \
            -e "s/9S3UXHYP65/${TEAM_ID}/g"
      - name: Install certificates and profile
        env:
          DEVELOPER_ID_APPLICATION_P12: ${{ secrets.DEVELOPER_ID_APPLICATION_P12 }}
          DEVELOPER_ID_INSTALLER_P12: ${{ secrets.DEVELOPER_ID_INSTALLER_P12 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          for name in DEVELOPER_ID_APPLICATION_P12 DEVELOPER_ID_INSTALLER_P12; do
            echo "${!name}" | base64 --decode > "$RUNNER_TEMP/$name.p12"
            security import "$RUNNER_TEMP/$name.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
            rm "$RUNNER_TEMP/$name.p12"
          done
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.provisionprofile"
          echo "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary_key.p8"
      - name: Build, sign, notarize
        env:
          PROVISIONING_PROFILE: ${{ runner.temp }}/release.provisionprofile
          APP_SIGN_IDENTITY: Developer ID Application
          PKG_SIGN_IDENTITY: Developer ID Installer
          NOTARY_KEY_PATH: ${{ runner.temp }}/notary_key.p8
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          OUTPUT_PKG: ${{ github.workspace }}/build/azooKey-${{ env.MARKETING_VERSION }}.pkg
        run: ./Tools/release_package.sh
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$MARKETING_VERSION" "build/azooKey-$MARKETING_VERSION.pkg" \
            --target "${{ github.event.workflow_run.head_sha }}" \
            --title "azooKey $MARKETING_VERSION" \
            --generate-notes
      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary_key.p8" "$RUNNER_TEMP/release.provisionprofile"
