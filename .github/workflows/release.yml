name: Release
# main のテストが通ったら、Developer ID で署名・公証した pkg と、Sparkle で配る zip と appcast を GitHub Release に置く
# アプリは releases/latest/download/appcast.xml を読むので、最新の Release の appcast がいつも使われる
on:
  workflow_run:
    workflows: ["Swift Build and Test"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release pkg
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: macos-15
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      MARKETING_VERSION: 1.0.${{ github.run_number }}
    steps:
      - name: Select Xcode 26
        run: |
          # 音声入力の SpeechTranscriber（macOS 26 SDK）を使うので、Xcode 26 のいちばん新しいものを使う
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
          test -n "$XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          submodules: true
          lfs: true
      - name: Fetch LFS files in submodules
        run: git submodule foreach --recursive git lfs pull
      - name: Apply bundle ID and Team ID
        # リポジトリには本家の ID が入っているので、フォークの ID に置き換える
        env:
          BUNDLE_OWNER: ${{ vars.BUNDLE_OWNER }}
          TEAM_ID: ${{ vars.TEAM_ID }}
        run: |
          test -n "$BUNDLE_OWNER" && test -n "$TEAM_ID"
          git grep -lz -e 'ensan\.inputmethod' -e '9S3UXHYP65' -- ':!.github' | xargs -0 sed -i '' \
            -e "s/\([a-z]*\)\.ensan\.inputmethod/\1.${BUNDLE_OWNER}.inputmethod/g" \
            -e "s/9S3UXHYP65/${TEAM_ID}/g"
      - name: Install certificates and profile
        env:
          DEVELOPER_ID_APPLICATION_P12: ${{ secrets.DEVELOPER_ID_APPLICATION_P12 }}
          DEVELOPER_ID_INSTALLER_P12: ${{ secrets.DEVELOPER_ID_INSTALLER_P12 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          for name in DEVELOPER_ID_APPLICATION_P12 DEVELOPER_ID_INSTALLER_P12; do
            echo "${!name}" | base64 --decode > "$RUNNER_TEMP/$name.p12"
            security import "$RUNNER_TEMP/$name.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
            rm "$RUNNER_TEMP/$name.p12"
          done
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.provisionprofile"
          echo "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary_key.p8"
      - name: Build, sign, notarize
        env:
          PROVISIONING_PROFILE: ${{ runner.temp }}/release.provisionprofile
          APP_SIGN_IDENTITY: Developer ID Application
          PKG_SIGN_IDENTITY: Developer ID Installer
          NOTARY_KEY_PATH: ${{ runner.temp }}/notary_key.p8
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          OUTPUT_PKG: ${{ github.workspace }}/build/azooKey-${{ env.MARKETING_VERSION }}.pkg
          OUTPUT_ZIP: ${{ github.workspace }}/build/azooKeyMac-${{ env.MARKETING_VERSION }}.zip
          # Sparkle の公開鍵（秘密ではないのでリポジトリの変数に置く）
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: ./Tools/release_package.sh
      - name: Make Sparkle appcast
        # 秘密鍵は標準入力で sign_update に渡す。鍵か公開鍵がまだなければ、appcast を作らずに pkg だけ出す
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
          ZIP_PATH: ${{ github.workspace }}/build/azooKeyMac-${{ env.MARKETING_VERSION }}.zip
          DOWNLOAD_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/v${{ env.MARKETING_VERSION }}/azooKeyMac-${{ env.MARKETING_VERSION }}.zip
          RELEASE_NOTES_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ env.MARKETING_VERSION }}
          OUTPUT_APPCAST: ${{ github.workspace }}/build/appcast.xml
        run: |
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ] || [ -z "$SPARKLE_PUBLIC_ED_KEY" ]; then
            echo "::warning::SPARKLE_ED_PRIVATE_KEY（Secret）か SPARKLE_PUBLIC_ED_KEY（変数）がないので、appcast を作りません"
            exit 0
          fi
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | ./Tools/make_appcast.sh
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS=("build/azooKey-$MARKETING_VERSION.pkg" "build/azooKeyMac-$MARKETING_VERSION.zip")
          if [ -f build/appcast.xml ]; then
            ASSETS+=("build/appcast.xml")
          fi
          gh release create "v$MARKETING_VERSION" "${ASSETS[@]}" \
            --target "${{ github.event.workflow_run.head_sha }}" \
            --title "azooKey $MARKETING_VERSION" \
            --generate-notes
      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary_key.p8" "$RUNNER_TEMP/release.provisionprofile"
